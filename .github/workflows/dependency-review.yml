# The dependencies a pull request adds, through GitHub's dependency review: a
# license off the organization's allowlist below, or a known vulnerability of
# any severity, fails the check. An organization ruleset requires it on every
# pull request of the repositories it targets, so a repository needs no file
# of its own, and a pull request cannot change or skip it.
# A ruleset ignores the triggers' filters and runs it only on pull_request and
# merge_group.
# Dependency review needs GitHub Code Security on a private repository: it
# runs on public repositories and on private ones whose custom property tier
# is private-licensed. Elsewhere, and on a merge group or a push, which have
# no pull request to compare, the job passes with a notice.
# The allowlist, the packages exempt from it and the failure policy are the
# organization's: a repository cannot change them. Its own exceptions, each
# an advisory (allow-ghsas) with a comment giving the reason, go in
# .github/dependency-review.yml, read from the base branch, never from the
# pull request. A package's license is exempted here only: the
# allow-dependencies-licenses input below overrides that key of the file.
name: "tnmn.io: dependency-review"

on:
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-review:
    name: "tnmn.io: dependency-review"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: applies
        name: Whether dependency review applies
        env:
          EVENT: ${{ github.event_name }}
          PRIVATE: ${{ github.event.repository.private }}
          TIER: ${{ github.event.repository.custom_properties.tier }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "::notice::No pull request to compare on $EVENT: nothing to review."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$PRIVATE" = true ] && [ "$TIER" != private-licensed ]; then
            echo "::notice::Dependency review needs GitHub Code Security on a private repository (tier: ${TIER:-unset})."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      # Only the exceptions file, at the base commit.
      - if: steps.applies.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base-config
          persist-credentials: false
          sparse-checkout: |
            .github/dependency-review.yml
          sparse-checkout-cone-mode: false
      - id: exceptions
        name: Exceptions from the base
        if: steps.applies.outputs.run == 'true'
        run: |
          file=""
          if [ -f .base-config/.github/dependency-review.yml ]; then
            cp .base-config/.github/dependency-review.yml .dependency-review-base.yml
            file=./.dependency-review-base.yml
          fi
          rm -rf .base-config
          echo "file=$file" >> "$GITHUB_OUTPUT"
      # The inputs override the same keys of the exceptions file, so a
      # repository can exempt an advisory but not change the policy or exempt
      # a package's license.
      - if: steps.applies.outputs.run == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ${{ steps.exceptions.outputs.file }}
          # MIT-0, BSD-2-Clause, ISC and 0BSD are permissive licenses that ask
          # no more than a notice. LicenseRef-scancode-google-patent-license-golang
          # is Go's golang.org/x modules', with BSD-3-Clause. PSF-2.0, the Python
          # Software Foundation's, is permissive too: it asks for the notice and
          # a summary of any changes; Python-2.0 is the same CPython license
          # family, approved by OSI and the FSF. BlueOak-1.0.0, isaacs's
          # packages' (glob, minimatch, lru-cache), is approved by OSI and adds
          # a patent grant MIT lacks; Kibana and GitLab allow it. No copyleft
          # license is on the list: adding one, or any other license, is a
          # decision made here.
          # Development dependencies are checked too: with pnpm-lock.yaml,
          # GitHub reports every package as runtime, even a devDependency, so
          # a license only development needs is exempted by package below.
          allow-licenses: MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, 0BSD, PSF-2.0, Python-2.0, BlueOak-1.0.0, LicenseRef-scancode-google-patent-license-golang
          # Packages whose license is not checked against the list, which
          # stays as it is. PostHog (PostHog/posthog's uv.lock) and Polar
          # (polarsource/polar's server/uv.lock) ship all six; PostHog/viaduck
          # and microsoft/hve-core exempt typing-extensions the same way.
          # - aiohappyeyeballs, from aiohttp, which hatchet-sdk depends on:
          #   PSF-2.0 on PyPI. GitHub detects GPL-1.0-or-later AND PSF-2.0 AND
          #   Python-2.0 AND ..., the GPL from CPython's license, as for
          #   typing-extensions.
          # - greenlet, from sqlalchemy[asyncio]: MIT AND PSF-2.0.
          # - typing-extensions, from fastapi, pydantic and sqlalchemy:
          #   PSF-2.0 on PyPI. GitHub detects Python-2.0 AND GPL-1.0-or-later
          #   AND ..., the GPL from the historical CNRI/BeOpen chain of
          #   CPython's license.
          # - pathspec, from mypy (1.16 and later), a development tool:
          #   MPL-2.0, whose copyleft covers changes to its own files only.
          #   fastapi/fastapi's uv.lock has it too.
          # - certifi, from requests, which docker depends on: MPL-2.0, as
          #   pathspec. It ships Mozilla's CA bundle, which is MPL-2.0.
          # - protobuf, from hatchet-sdk and grpcio: BSD-3-Clause on PyPI.
          #   GitHub detects BSD-3-Clause AND LicenseRef-scancode-protobuf,
          #   scancode's name for the paragraph protobuf's LICENSE adds to
          #   BSD-3-Clause: code protoc generates is owned by the owner of its
          #   input.
          # - lightningcss and its 11 platform binaries, from vite 8, which
          #   Vitest depends on: MPL-2.0, as pathspec. GitLab,
          #   grafana/faro-web-sdk and microsoft/hve-core exempt it the same
          #   way.
          # - caniuse-lite (CC-BY-4.0), browser data from browserslist;
          #   language-subtag-registry and spdx-license-ids (CC0-1.0) and
          #   spdx-exceptions (CC-BY-3.0), data from license tooling. Creative
          #   Commons licenses are meant for data, not code; GitLab approves
          #   caniuse-lite.
          # - tweetnacl, from ssh2: Unlicense, a public domain dedication
          #   without a patent grant, so by package and not on the list.
          #   GitLab and actions/checkout allow it.
          # - type-fest: MIT OR CC0-1.0 on npm. GitHub detects CC0-1.0 AND MIT.
          #   webpack exempts it the same way.
          allow-dependencies-licenses: >-
            pkg:npm/caniuse-lite,
            pkg:npm/language-subtag-registry,
            pkg:npm/lightningcss,
            pkg:npm/lightningcss-android-arm64,
            pkg:npm/lightningcss-darwin-arm64,
            pkg:npm/lightningcss-darwin-x64,
            pkg:npm/lightningcss-freebsd-x64,
            pkg:npm/lightningcss-linux-arm-gnueabihf,
            pkg:npm/lightningcss-linux-arm64-gnu,
            pkg:npm/lightningcss-linux-arm64-musl,
            pkg:npm/lightningcss-linux-x64-gnu,
            pkg:npm/lightningcss-linux-x64-musl,
            pkg:npm/lightningcss-win32-arm64-msvc,
            pkg:npm/lightningcss-win32-x64-msvc,
            pkg:npm/spdx-exceptions,
            pkg:npm/spdx-license-ids,
            pkg:npm/tweetnacl,
            pkg:npm/type-fest,
            pkg:pypi/aiohappyeyeballs,
            pkg:pypi/certifi,
            pkg:pypi/greenlet,
            pkg:pypi/pathspec,
            pkg:pypi/protobuf,
            pkg:pypi/typing-extensions
          # Every new vulnerability, whatever its severity and scope. Set here
          # so that the exceptions file cannot turn a check off or make it warn.
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          license-check: true
          vulnerability-check: true
          warn-only: false
          # A comment would need pull-requests: write.
          comment-summary-in-pr: never
