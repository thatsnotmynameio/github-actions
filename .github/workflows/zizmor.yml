# zizmor's security audit of a repository's workflows, composite actions and
# Dependabot configuration. An organization ruleset requires it on every pull
# request of the repositories it targets, so a repository needs no file of its
# own, and a pull request cannot change or skip it. A public repository also
# calls it with workflow_call on each push to main, so code scanning has the
# analysis of main that a pull request's alerts are compared against.
# A ruleset ignores the triggers' filters and runs it only on pull_request and
# merge_group.
# The configuration (.github/zizmor.yml or zizmor.yml) comes from the base
# branch, never from the pull request: a pull request cannot turn a rule off
# for itself. zizmor runs with --no-ignores: it honors no `# zizmor: ignore`
# comment, which a pull request could add for its own finding, and no `ignore`
# list in the configuration. A rule turned off there with `disable: true` stays
# off. An exception to one finding is a dismissal of its alert in code
# scanning, which an organization owner or security manager approves.
# On a public repository the findings go to code scanning under the category
# "zizmor", and the code scanning rule of a ruleset blocks the pull requests
# that add one. A private repository without GitHub Code Security has no code
# scanning: there the findings only show in the job's log, and the job never
# fails on them.
name: "tnmn.io: zizmor"

on:
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

jobs:
  zizmor:
    name: "tnmn.io: zizmor"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # uploads the results to code scanning
    steps:
      # On a pull request, its head commit, not the merge commit GitHub tests
      # it with: GitHub makes a new merge commit when it rechecks the pull
      # request, a merge attempt included, and code scanning then waits for
      # results on the new one. The head commit stays until the next push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Only the configuration files, at the base commit; on a push, at the
      # pushed commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: .base-config
          persist-credentials: false
          sparse-checkout: |
            .github/zizmor.yml
            .github/zizmor.yaml
            zizmor.yml
            zizmor.yaml
          sparse-checkout-cone-mode: false
      # Always passed explicitly, with no rule when the base has none, so
      # zizmor never finds the pull request's own file. Inside the workspace:
      # the action mounts only the workspace into zizmor's container.
      - name: Configuration from the base
        run: |
          config=.zizmor-base-config.yml
          echo 'rules: {}' > "$config"
          for f in .base-config/.github/zizmor.yml .base-config/.github/zizmor.yaml .base-config/zizmor.yml .base-config/zizmor.yaml; do
            if [ -f "$f" ]; then cp "$f" "$config"; break; fi
          done
          rm -rf .base-config
      # zizmor audits workflows, composite actions (action.yml) and Dependabot's
      # configuration. A repository with none has nothing to audit: the check
      # passes, and no analysis is uploaded.
      - id: inputs
        name: Inputs to audit
        run: |
          if compgen -G '.github/workflows/*.y*ml' > /dev/null || compgen -G '.github/dependabot.y*ml' > /dev/null \
            || [ -n "$(find . -path ./.git -prune -o \( -name action.yml -o -name action.yaml \) -print -quit)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No workflow, composite action or Dependabot configuration: nothing to audit."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      # zizmor's container image, pinned by digest (zizmor 1.30.1, the one
      # zizmor-action v0.6.4 runs), with the workspace read-only. zizmor-action
      # has no input for --no-ignores, so the job runs the image itself. With
      # --no-exit-codes zizmor exits 0 on findings and 1 on an error, such as a
      # malformed configuration, which fails the job.
      - id: zizmor
        name: zizmor
        if: steps.inputs.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }} # zizmor's online audits
          IMAGE: ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          format=sarif
          [ "$PRIVATE" = true ] && format=plain
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace:ro" --workdir /workspace --env GH_TOKEN \
            "$IMAGE" --persona=regular --no-ignores --no-exit-codes --color=never \
            --format="$format" --config=.zizmor-base-config.yml . > "$RUNNER_TEMP/zizmor.out"
          [ "$format" = plain ] && cat "$RUNNER_TEMP/zizmor.out"
          echo "sarif=$RUNNER_TEMP/zizmor.out" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: steps.inputs.outputs.found == 'true' && !github.event.repository.private
        with:
          sarif_file: ${{ steps.zizmor.outputs.sarif }}
          category: zizmor
          # On a pull request, the results go to its head commit, which code
          # scanning accepts as the pull request's; elsewhere, to the run's
          # ref and commit.
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || '' }}
          sha: ${{ github.event.pull_request.head.sha || '' }}
