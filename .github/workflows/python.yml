# A Python project's checks, on Linux: a current uv.lock, ruff's formatting
# and lint, mypy's type check when the project configures it, the tests with
# coverage, and the coverage floor; then the build of its packages and, when
# it has a Dockerfile, its image. An
# organization ruleset requires it on every pull request of the Python
# repositories it targets, so a repository needs no file of its own, and a
# pull request cannot change or skip it. A repository also calls it with
# workflow_call on each push to main, which gives code scanning the analysis
# of main that a pull request's ruff alerts are compared against.
# A ruleset ignores the triggers' filters and runs it only on pull_request and
# merge_group.
# The settings that could turn a check off come from the base commit, never
# from the pull request: .github/python.yml, ruff's ruff.toml (or .ruff.toml),
# mypy's mypy.ini (or .mypy.ini). Neither reads its section of pyproject.toml
# ([tool.ruff], [tool.mypy]) here, so a project keeps their configuration in
# those files. A change to them applies once it merges.
# What the pull request builds and tests is its own: pyproject.toml, uv.lock,
# the code and the Dockerfile.
# A repository without pyproject.toml has nothing to check: only the setup job
# runs. Known vulnerabilities in the dependencies are grype's ("tnmn.io:
# grype"), which reads uv.lock.
# The tests' results go to Trunk Flaky Tests when .github/python.yml names
# test collections (see the trunk job).
# Only the trunk job holds a secret, Trunk's token, and it runs none of the
# project's code: on a Dependabot pull request the updated project runs in the
# other jobs, which hold none.
name: "tnmn.io: python"

on:
  pull_request:
  merge_group:
  workflow_call:
    secrets:
      # Trunk's organization token, for the trunk job. Without it, no result
      # goes to Trunk.
      TRUNK_API_TOKEN:
        required: false

permissions:
  contents: read

env:
  UV_VERSION: 0.12.23
  RUFF_VERSION: 0.16.10
  MYPY_VERSION: 2.4.0
  COVERAGE_VERSION: 7.16.2
  TRUNK_CLI_VERSION: 0.16.0

jobs:
  # Reads .github/python.yml from the base commit:
  #
  #   # The coverage floor: the least total coverage, in percent, of the
  #   # statements and branches the tests cover (none by default).
  #   coverage: 90
  #   # Trunk Flaky Tests' test collections, by their 8-character IDs, each
  #   # with the pytest arguments that pick its tests (all of them without
  #   # any). The tests run in a job of their own for each, named after the
  #   # arguments that are not options (tests without any). None by default:
  #   # the tests run in one job, and nothing goes to Trunk.
  #   trunk:
  #     - collection: AbC12345
  #       pytest: [tests/worker]
  #     - collection: XyZ98765
  #       pytest: [--ignore=tests/worker]
  setup:
    name: "tnmn.io: python / setup"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      project: ${{ steps.tree.outputs.project }}
      package: ${{ steps.tree.outputs.package }}
      image: ${{ steps.tree.outputs.image }}
      coverage: ${{ steps.config.outputs.coverage }}
      trunk: ${{ steps.config.outputs.trunk }}
      tests: ${{ steps.config.outputs.tests }}
    steps:
      # Only the files that decide which jobs run, at the commit checked.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            pyproject.toml
            uv.lock
            Dockerfile
          sparse-checkout-cone-mode: false
      # A project is checked against its uv.lock, so one without it fails
      # here. A package is a project with a [build-system].
      - id: tree
        name: Project, package and image
        run: |
          if [ -f pyproject.toml ]; then
            if [ ! -f uv.lock ]; then
              echo "::error::pyproject.toml without uv.lock: run uv lock and commit it."
              exit 1
            fi
            echo "project=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No pyproject.toml: nothing to check."
            echo "project=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f pyproject.toml ] && python3 -c 'import sys, tomllib; sys.exit("build-system" not in tomllib.load(open("pyproject.toml", "rb")))'; then
            echo "package=true" >> "$GITHUB_OUTPUT"
          else
            echo "package=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f Dockerfile ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi
      # Only the configuration, at the base commit; on a push, at the pushed
      # commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: .base-config
          persist-credentials: false
          sparse-checkout: |
            .github/python.yml
          sparse-checkout-cone-mode: false
      # Every value is checked here, so the jobs below can use them as they
      # are: a percentage, the collections, and the test jobs' matrix, one
      # entry for each collection (or a single one, with no collection). Each
      # entry's label, which names its test and trunk jobs, is its pytest
      # arguments that are not options, or tests without any: a job's name
      # can call no function.
      - id: config
        name: Configuration from the base
        run: |
          config=.base-config/.github/python.yml
          if [ -f "$config" ]; then
            json="$(yq -o=json -I=0 '. // {}' "$config")"
          else
            json='{}'
          fi
          rm -rf .base-config
          coverage="$(jq -r '
            (.coverage // "")
            | if . == "" or (type == "number" and . >= 0 and . <= 100) then . else error("coverage: a percentage, from 0 to 100") end
          ' <<< "$json")"
          trunk="$(jq -c '
            (.trunk // [])
            | if type != "array" or any(.[];
                type != "object"
                or (keys - ["collection", "pytest"] | length) > 0
                or (.collection | type) != "string" or (.collection | test("^[A-Za-z0-9]{8}$") | not)
                or (has("pytest") and ((.pytest | type) != "array" or any(.pytest[]; type != "string"))))
              then error("trunk: a list of {collection: an 8-character ID, pytest: a list of pytest arguments}") else . end
            | to_entries | map({
                index: .key,
                collection: .value.collection,
                pytest: (.value.pytest // []),
                label: ((.value.pytest // []) | map(select(startswith("-") | not)) | join(" ") | if . == "" then "tests" else . end)
              })
          ' <<< "$json")"
          if [ "$trunk" = "[]" ]; then
            tests='[{"index":0,"collection":"","pytest":[],"label":"tests"}]'
            trunk=""
          else
            tests="$trunk"
          fi
          {
            echo "coverage=$coverage"
            echo "trunk=$trunk"
            echo "tests=$tests"
          } >> "$GITHUB_OUTPUT"

  # The lock, the format, the lint and the types.
  python:
    name: "tnmn.io: python / lint"
    needs: setup
    if: needs.setup.outputs.project == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # uploads ruff's findings to code scanning
    steps:
      # On a pull request, its head commit, not the test merge commit: ruff's
      # findings are filed under it (see the upload below).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: .base-config
          persist-credentials: false
          sparse-checkout: |
            ruff.toml
            .ruff.toml
            mypy.ini
            .mypy.ini
          sparse-checkout-cone-mode: false
      # The base's file replaces the pull request's at the same path, so the
      # paths inside it resolve as they do locally. ruff always gets its
      # configuration explicitly, or none (--isolated), so it never reads one
      # the pull request adds or changes, pyproject.toml's included. So does
      # mypy, which runs only with one.
      - id: base
        name: Configuration from the base
        shell: bash
        run: |
          rm -f ruff.toml .ruff.toml mypy.ini .mypy.ini
          ruff="--isolated"
          for f in ruff.toml .ruff.toml; do
            if [ -f ".base-config/$f" ]; then
              cp ".base-config/$f" "$f"
              ruff="--config=$f"
              break
            fi
          done
          mypy=""
          for f in mypy.ini .mypy.ini; do
            if [ -f ".base-config/$f" ]; then
              cp ".base-config/$f" "$f"
              mypy="$f"
              break
            fi
          done
          rm -rf .base-config
          {
            echo "ruff=$ruff"
            echo "mypy=$mypy"
          } >> "$GITHUB_OUTPUT"
      # The Python of .python-version, or of pyproject.toml's requires-python.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # uv.lock matches pyproject.toml.
      - name: uv lock
        run: uv lock --check
      - name: uv sync
        run: uv sync --locked
      - name: ruff format
        env:
          RUFF: ${{ steps.base.outputs.ruff }}
        run: uvx "ruff@${RUFF_VERSION}" format --check "$RUFF"
      # The findings also go to a SARIF file, which code scanning shows in the
      # Security tab and on the pull request's lines.
      - name: ruff check
        if: ${{ !cancelled() }}
        env:
          RUFF: ${{ steps.base.outputs.ruff }}
        shell: bash
        run: |
          status=0
          uvx "ruff@${RUFF_VERSION}" check --output-format=github "$RUFF" || status=$?
          uvx "ruff@${RUFF_VERSION}" check --exit-zero --output-format=sarif --output-file=ruff.sarif "$RUFF"
          exit "$status"
      # After a failed lint too, so its findings show; not when lint never ran.
      # On a pull request, filed under its head commit: GitHub makes a new
      # merge commit when it rechecks the pull request (a ruleset change or a
      # merge attempt), and code scanning would then wait for results on the
      # new one. A private repository without GitHub Code Security has no code
      # scanning: there the findings only show in the log.
      - if: ${{ !cancelled() && hashFiles('ruff.sarif') != '' && !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ruff.sarif
          category: ruff
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || '' }}
          sha: ${{ github.event.pull_request.head.sha || '' }}
      # The types, when the base has mypy's configuration: mypy at this
      # workflow's version, over the project's locked environment, so it
      # follows the imports and loads the plugins the configuration names.
      # It checks the configuration's files, or src/ in a src layout and the
      # whole tree otherwise. Each finding becomes an annotation on the pull
      # request's lines.
      - name: mypy
        if: ${{ !cancelled() && steps.base.outputs.mypy != '' }}
        env:
          MYPY: ${{ steps.base.outputs.mypy }}
        shell: bash
        run: |
          targets=()
          if ! uv run --locked python -c 'import configparser, sys; c = configparser.RawConfigParser(); c.read(sys.argv[1]); sys.exit(not c.has_option("mypy", "files"))' "$MYPY"; then
            if [ -d src ]; then targets=(src); else targets=(.); fi
          fi
          status=0
          uv run --locked --with "mypy==${MYPY_VERSION}" mypy --config-file="$MYPY" --output=json "${targets[@]}" > "$RUNNER_TEMP/mypy.json" || status=$?
          jq -Rr '
            def data: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def property: data | gsub(":"; "%3A") | gsub(","; "%2C");
            (fromjson? // null) as $f
            | if ($f | type) == "object" then
                "::\(if $f.severity == "error" then "error" else "notice" end)"
                + " file=\($f.file | property),line=\($f.line),col=\($f.column + 1),title=\("mypy [\($f.code)]" | property)"
                + "::\("\($f.file):\($f.line): \($f.message)\(if $f.hint then "\n\($f.hint)" else "" end)" | data)"
              elif . != "" then .
              else empty end
          ' "$RUNNER_TEMP/mypy.json"
          exit "$status"

  # The project's own pytest, from its locked dependencies, under coverage at
  # this workflow's version: once, or once for each of Trunk's collections,
  # with its arguments. A project without test files has none to run, and
  # passes; so does a collection whose arguments select no test. Coverage
  # measures src/ in a src layout, the whole tree otherwise. Each job keeps
  # its coverage data for the coverage job, and with a collection its JUnit
  # report (xunit1, which names each test's file) for the trunk job.
  test:
    name: "tnmn.io: pytest / ${{ matrix.label }}"
    needs: setup
    if: needs.setup.outputs.project == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One collection's failure does not cancel the others' runs.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: pytest
        env:
          COLLECTION: ${{ matrix.collection }}
          PYTEST_ARGS: ${{ toJSON(matrix.pytest) }}
        run: |
          if [ -z "$(git ls-files -- 'test_*.py' '*/test_*.py' '*_test.py')" ]; then
            echo "::notice::No test file: nothing to test."
            exit 0
          fi
          if ! uv run --locked python -c 'import pytest' 2> /dev/null; then
            echo "::error::Test files but no pytest: add it with uv add --dev pytest."
            exit 1
          fi
          source=.
          if [ -d src ]; then source=src; fi
          mapfile -d '' args < <(jq -j '.[] | . + "\u0000"' <<< "$PYTEST_ARGS")
          status=0
          uv run --locked --with "coverage==${COVERAGE_VERSION}" coverage run --parallel-mode --branch --source="$source" -m pytest \
            --junit-xml="$RUNNER_TEMP/junit.xml" -o junit_family=xunit1 "${args[@]}" || status=$?
          # 5: no test selected.
          if [ "$status" -eq 5 ] && [ -n "$COLLECTION" ]; then
            echo "::notice::No test selected for collection ${COLLECTION}."
            status=0
          fi
          exit "$status"
      - if: ${{ !cancelled() && needs.setup.outputs.coverage != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.index }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - if: ${{ !cancelled() && matrix.collection != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.index }}
          path: ${{ runner.temp }}/junit.xml
          if-no-files-found: ignore
          retention-days: 1

  # The total of the statements and branches the test jobs measured, as
  # coverage report counts it, when every test job passed. Without coverage
  # data (no test file), there is nothing to check.
  coverage:
    name: "tnmn.io: python / coverage"
    needs: [setup, test]
    if: needs.setup.outputs.coverage != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The sources, for coverage report to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: coverage floor
        env:
          FLOOR: ${{ needs.setup.outputs.coverage }}
        run: |
          if ! compgen -G '.coverage.*' > /dev/null; then
            echo "::notice::No coverage data: nothing to check."
            exit 0
          fi
          uvx "coverage@${COVERAGE_VERSION}" combine
          uvx "coverage@${COVERAGE_VERSION}" report --fail-under="$FLOOR"

  # Sends each collection's JUnit report to Trunk Flaky Tests, through Trunk's
  # uploader, when the base's .github/python.yml names collections. The only
  # job with a secret, Trunk's token: it runs none of the project's code and
  # checks out nothing, so the uploader gets the repository, commit and branch
  # from the run. Without the token (on a Dependabot or a fork's pull request,
  # or where the secret does not reach) it sends nothing, and a failed upload
  # never fails the check. Upload alone: quarantining would need the token
  # where the tests run.
  trunk:
    name: "tnmn.io: trunk / upload / ${{ matrix.label }}"
    needs: [setup, test]
    if: ${{ !cancelled() && needs.setup.outputs.trunk != '' && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.tests) }}
    steps:
      - id: token
        name: Trunk's token and organization
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
          TRUNK_ORG_URL_SLUG: ${{ vars.TRUNK_ORG_URL_SLUG }}
        run: |
          if [ -z "$TRUNK_API_TOKEN" ] || [ -z "$TRUNK_ORG_URL_SLUG" ]; then
            echo "::notice::No TRUNK_API_TOKEN secret or TRUNK_ORG_URL_SLUG variable here: nothing goes to Trunk."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      # A pattern, not a name: a test job that wrote no report leaves none,
      # and there is then nothing to send. The one artifact it matches lands
      # in junit/ itself, in the workspace (empty, with no checkout), where
      # hashFiles looks.
      - if: steps.token.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: junit-${{ matrix.index }}
          path: junit
      - if: ${{ steps.token.outputs.found == 'true' && hashFiles('junit/junit.xml') != '' }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@a86313c7029d22e6ea2d5c346060a224d90053dc # v2.1.6
        with:
          junit-paths: junit/junit.xml
          org-slug: ${{ vars.TRUNK_ORG_URL_SLUG }}
          token: ${{ secrets.TRUNK_API_TOKEN }}
          test-collection-id: ${{ matrix.collection }}
          cli-version: ${{ env.TRUNK_CLI_VERSION }}
          # No cache: an entry a pull request's own workflow wrote under the
          # same key would run here, next to the token.
          use-cache: false
          use-uncloned-repo: true
          # The pull request's by default; a push's and a merge queue's here.
          gh-repo-url: ${{ github.event.pull_request.base.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}
          gh-repo-head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          repo-head-branch: ${{ github.head_ref || github.ref_name }}

  # The release build: the project's sdist and wheel when it is a package,
  # and its image when it has a Dockerfile, published nowhere. A change that
  # breaks either fails here, not when it is released.
  build:
    name: "tnmn.io: python / build"
    needs: setup
    if: needs.setup.outputs.project == 'true' && (needs.setup.outputs.package == 'true' || needs.setup.outputs.image == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # No cache, as in a release: the build reads nothing another workflow
      # could have written.
      - if: needs.setup.outputs.package == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: uv build
        if: needs.setup.outputs.package == 'true'
        run: uv build
      - name: docker build
        if: needs.setup.outputs.image == 'true'
        run: docker build .
