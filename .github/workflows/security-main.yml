# zizmor's and grype's analyses of this repository's main, through its
# zizmor.yml and grype.yml, under the categories "zizmor" and "grype": code
# scanning compares each pull request's alerts with them. On a pull request
# the organization's rulesets run the same workflows. Daily as well, so the
# Security tab shows the advisories published since the last push.
name: security (main)

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"

permissions: {}

jobs:
  # The full references, pinned: zizmor asks for the self-repository syntax
  # ($/), which actionlint 1.7.12 rejects, and flags ./ as unpinned. Bump them
  # with the organization's rulesets.
  zizmor:
    permissions:
      contents: read
      security-events: write # uploads the results to code scanning
    uses: thatsnotmynameio/github-actions/.github/workflows/zizmor.yml@b3eb85dec19927bd5be988c75401c29909e4676c # main
  grype:
    permissions:
      contents: read
      security-events: write # uploads the results to code scanning
    uses: thatsnotmynameio/github-actions/.github/workflows/grype.yml@b3eb85dec19927bd5be988c75401c29909e4676c # main
