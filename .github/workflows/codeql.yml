# CodeQL's advanced setup, with the security-extended suite, published to
# code scanning: the Go module, test files included, when the repository has
# go.mod, the Python project when it has pyproject.toml, the JavaScript and
# TypeScript project when it has package.json, and the GitHub Actions
# workflows. A repository calls it with
# workflow_call from its own workflow, on every pull request, on each push to
# main and daily: GitHub does not allow CodeQL's init and analyze actions in a
# workflow a ruleset requires, so no organization ruleset can run it.
#
#   jobs:
#     codeql:
#       permissions:
#         actions: read
#         contents: read
#         security-events: write
#       uses: thatsnotmynameio/github-actions/.github/workflows/codeql.yml@<sha> # vX.Y.Z
#
# actions: read is CodeQL's: its analyze and upload read the workflow run,
# which a private repository's token reaches only with it. A caller that
# grants less fails to start the workflow.
# Its checks are "<caller job> / go", "<caller job> / python", "<caller
# job> / javascript-typescript" and "<caller job> / actions", which a
# caller's ruleset requires by name. Until the release that renamed them
# they were "<caller job> / codeql (<language>)": a caller moving its pin
# past it requires the new names in the same change, or its pull requests
# wait for checks that never come. Code scanning tells analyses apart by the
# caller's workflow and job, the category (/language:go, /language:python,
# /language:javascript-typescript, /language:actions) and the matrix values
# (language, build-mode): a change to any of them leaves the old analysis's
# alerts open on main.
# The configuration (.github/codeql/codeql-config.yml) comes from the base
# commit, never from the pull request: a pull request cannot exclude a path or
# a query for itself. Without one, the security-extended suite runs.
# Its alerts do not fail the jobs: a code_scanning rule does. A job fails on
# a build or analysis error, and then uploads nothing. A repository without
# GitHub Code Security (a private one without the license) has no code
# scanning: there the findings only show as annotations and in the job's log,
# and never fail it. No job holds a secret:
# code scanning accepts an upload from any run that the pull_request event
# started, a fork's included, with the read-only token.
name: codeql

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The languages to analyze: Go when the commit has go.mod, Python when it
  # has pyproject.toml, JavaScript and TypeScript when it has package.json,
  # and always the workflows of the repository that calls this one. Python,
  # JavaScript and TypeScript need no build: CodeQL reads their source as it
  # is.
  setup:
    name: setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.languages.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            go.mod
            pyproject.toml
            package.json
          sparse-checkout-cone-mode: false
      - id: languages
        name: Languages
        run: |
          matrix='[{"language": "actions", "build-mode": "none"}]'
          if [ -f package.json ]; then
            matrix="$(jq -c '[{"language": "javascript-typescript", "build-mode": "none"}] + .' <<< "$matrix")"
          fi
          if [ -f pyproject.toml ]; then
            matrix="$(jq -c '[{"language": "python", "build-mode": "none"}] + .' <<< "$matrix")"
          fi
          if [ -f go.mod ]; then
            matrix="$(jq -c '[{"language": "go", "build-mode": "manual"}] + .' <<< "$matrix")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  codeql:
    name: ${{ matrix.language }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # CodeQL reads the workflow run, on a private repository too
      contents: read
      security-events: write # uploads the results to code scanning
    # A pull request's newer run replaces the older one. Each main commit gets
    # a group of its own and is never cancelled.
    concurrency:
      group: ${{ github.workflow }}-codeql-${{ matrix.language }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      # On a pull request, its head commit, not the test merge commit: GitHub
      # makes a new merge commit when it rechecks the pull request (a ruleset
      # change or a merge attempt), and code scanning then waits for results
      # on the new one. The head commit stays until the next push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Only the configuration, at the base commit; on a push, at the pushed
      # commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: .base-config
          persist-credentials: false
          sparse-checkout: |
            .github/codeql/codeql-config.yml
          sparse-checkout-cone-mode: false
      # Inside the workspace, where CodeQL's init requires it.
      - id: base
        name: Configuration from the base
        run: |
          file=""
          if [ -f .base-config/.github/codeql/codeql-config.yml ]; then
            cp .base-config/.github/codeql/codeql-config.yml .codeql-base-config.yml
            file=./.codeql-base-config.yml
          fi
          rm -rf .base-config
          echo "file=$file" >> "$GITHUB_OUTPUT"
      # Before CodeQL's init, so its extractor uses this Go.
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ${{ steps.base.outputs.file }}
          queries: ${{ steps.base.outputs.file == '' && 'security-extended' || '' }}
      # The Go extractor sees only the go commands this step runs. go build
      # extracts no test file, and the extract_tests option does not apply to a
      # traced build: only a traced go test does, and only with build flags,
      # since the extractor hands them to go list (-run makes it fail and skip
      # every test). So the step compiles the test binaries with go test -c,
      # which runs no test. go test -c -o dir/ names a binary after its
      # package's last path element (cmd/crew and internal/crew are both
      # crew.test), so packages that share one go in separate batches.
      - name: build
        if: matrix.language == 'go'
        run: |
          out="$RUNNER_TEMP/codeql-tests"
          mkdir -p "$out"
          go build ./...
          go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... |
            awk -F/ 'NF { print ++seen[$NF], $0 }' > "$out/packages"
          while read -r batch; do
            mapfile -t packages < <(awk -v batch="$batch" '$1 == batch { print $2 }' "$out/packages")
            go test -c -o "$out/$batch/" "${packages[@]}"
          done < <(cut -d' ' -f1 "$out/packages" | sort -un)
      - id: analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: ${{ runner.temp }}/codeql-results
      # A database without the tests would upload as a complete analysis and
      # mark their alerts fixed: a failed build of the tests does not fail the
      # extraction. So the job checks the Go database's source archive, which
      # lists every file extracted, before it uploads. A module without test
      # files has none to miss.
      - name: extracted files
        if: matrix.language == 'go'
        env:
          DB_LOCATIONS: ${{ steps.analyze.outputs.db-locations }}
        run: |
          if [ -z "$(git ls-files -- '*_test.go')" ]; then
            echo "No test file in the module."
            exit 0
          fi
          database="$(jq -r .go <<< "$DB_LOCATIONS")"
          unzip -Z1 "$database/src.zip" | awk -v root="${GITHUB_WORKSPACE#/}/" '
            index($0, root) != 1 || !/\.go$/ { next }
            { path = substr($0, length(root) + 1) }
            path ~ /_test\.go$/ { tests++ }
            END {
              printf "test files: %d\n", tests
              if (!tests) {
                print "::error::The Go database is missing the test files."
                exit 1
              }
            }'
      # Code scanning needs GitHub Code Security: without it, its API answers
      # that Code Security (or Advanced Security) must be enabled, and an
      # upload would fail. Any other answer, an error included, uploads.
      - id: scanning
        name: Code scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response="$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/analyses?per_page=1" 2> /dev/null || true)"
          if jq -e 'type == "object" and ((.message // "") | test("(Code|Advanced) Security must be enabled"))' <<< "$response" > /dev/null 2>&1; then
            echo "::notice::No GitHub Code Security in this repository: the findings show as annotations, not in code scanning."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi
      # Without code scanning, each finding becomes a warning annotation on its
      # file and line.
      - name: findings
        if: steps.scanning.outputs.upload == 'false'
        run: |
          shopt -s nullglob
          sarif=("$RUNNER_TEMP"/codeql-results/*.sarif)
          if [ "${#sarif[@]}" -eq 0 ]; then
            echo "No SARIF file."
            exit 0
          fi
          jq -r '
            def data: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def property: data | gsub(":"; "%3A") | gsub(","; "%2C");
            .runs[].results[]?
            | (.locations[0].physicalLocation // {}) as $l
            | "::warning file=\(($l.artifactLocation.uri // "") | property),line=\($l.region.startLine // 1),title=\("CodeQL \(.ruleId // "finding")" | property)::\((.message.text // "") | data)"
          ' "${sarif[@]}"
          echo "findings: $(jq -s '[.[].runs[].results[]?] | length' "${sarif[@]}")"
      - if: steps.scanning.outputs.upload == 'true'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/codeql-results
          category: /language:${{ matrix.language }}
          # On a pull request, filed under its head commit; elsewhere, under the
          # run's ref and commit.
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || '' }}
          sha: ${{ github.event.pull_request.head.sha || '' }}
