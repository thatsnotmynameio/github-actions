# Weekly pull requests for new versions of the tools typescript.yml runs
# (.github/typescript), in one group: oxlint needs a matching oxlint-tsgolint.
# A version is proposed only once it is 7 days old, so a compromised release
# has time to be pulled. Titled fix, so each bump publishes a release and
# reaches the callers (README, Versions); one that makes the check stricter
# is retitled feat by hand.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/.github/typescript"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix"
    groups:
      typescript-tools:
        patterns: ["*"]
